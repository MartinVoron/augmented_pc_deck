[package]
name = "augmented-pc-deck"
version = "0.1.0"
description = "Tableau de bord de bureau pour Windows, façon Stream Deck"
authors = ["Martin Voron"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
# Le suffixe `_lib` évite un conflit de nom avec le binaire sous Windows.
name = "augmented_pc_deck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Jetons : Gestionnaire d'identification sous Windows (magasin en mémoire ailleurs, pour les tests).
keyring = "3"
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tauri-plugin-notification = "2"
tauri-plugin-log = "2"
log = "0.4"
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"
# Lanceur : ouvrir fichiers, dossiers et URL avec l'application associée.
open = "5"
# Lanceur : icônes converties en PNG pour l'interface.
png = "0.18"
base64 = "0.22"
# Lanceur : sélecteur de fichier pour choisir la cible d'un raccourci.
tauri-plugin-dialog = "2"
# Processus : usage du processeur, de la mémoire et des disques.
sysinfo = { version = "0.36.1", default-features = false, features = ["system", "disk"] }
# Minuteurs : attente de la fin d'un compte à rebours, sans bloquer.
tokio = { version = "1", features = ["time"] }
# GitHub, Gmail : appels HTTPS (TLS de Windows, sans dépendance de compilation en plus).
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls", "http2", "charset"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
# Lanceur : extraction des icônes par le shell de Windows.
# Musique : sessions média de Windows (morceau en cours, lecture).
windows = { version = "0.62", features = [
  "Foundation",
  "Media_Control",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_UI_Shell",
] }
