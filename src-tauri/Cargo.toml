[package]
name = "augmented-pc-deck"
version = "0.1.0"
description = "Tableau de bord de bureau pour Windows, façon Stream Deck"
authors = ["Martin Voron"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
# Le suffixe `_lib` évite un conflit de nom avec le binaire sous Windows.
name = "augmented_pc_deck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tauri-plugin-notification = "2"
