[package]
name = "augmented-pc-deck"
version = "0.1.0"
description = "Tableau de bord de bureau pour Windows, façon Stream Deck"
authors = ["Martin Voron"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
# Le suffixe `_lib` évite un conflit de nom avec le binaire sous Windows.
name = "augmented_pc_deck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Jetons : Gestionnaire d'identification sous Windows (magasin en mémoire ailleurs, pour les tests).
keyring = "3"
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tauri-plugin-notification = "2"
tauri-plugin-log = "2"
log = "0.4"
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
