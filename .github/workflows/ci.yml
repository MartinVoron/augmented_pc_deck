name: CI

# Vérifie chaque PR (et main) sous Windows et sous Linux : lint, types, tests et compilation.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Un nouvel envoi sur la même PR annule la vérification en cours.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    name: ${{ matrix.nom }}
    strategy:
      # Une panne sous Linux ne doit pas cacher le résultat sous Windows, et inversement.
      fail-fast: false
      matrix:
        include:
          - nom: Windows
            os: windows-latest
            artefact: installateurs-windows
            paquets: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
          # Ubuntu 22.04 : les paquets marchent aussi sur les distributions un peu anciennes.
          - nom: Linux
            os: ubuntu-22.04
            artefact: paquets-linux
            paquets: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      # Garde les fins de ligne LF du dépôt, sinon Prettier signale tous les fichiers.
      - name: Garder les fins de ligne LF
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      # Bibliothèques de Tauri sous Linux (fenêtre, zone de notification, D-Bus).
      - name: Installer les bibliothèques Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libssl-dev

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Installer Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Mettre en cache la compilation Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Installer les dépendances npm
        run: npm ci

      - name: Lint (ESLint, Prettier, cargo fmt, cargo clippy)
        run: npm run lint

      - name: Types (svelte-check)
        run: npm run check

      - name: Tests de l'interface (Vitest)
        run: npm run test:front

      - name: Tests Rust (cargo test)
        run: npm run test:rust

      # Produit aussi les installateurs (.exe et .msi sous Windows, .deb et .AppImage
      # sous Linux) : on peut les tester avant la fusion.
      - name: Compiler l'application et les installateurs
        run: npm run tauri build

      - name: Garder les installateurs (onglet Summary de la vérification)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artefact }}
          path: ${{ matrix.paquets }}
          if-no-files-found: error
          retention-days: 14
