name: Conventions

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  issues: read

jobs:
  conventions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Nom de la branche
        env:
          BRANCH: ${{ github.head_ref }}
        run: scripts/check-branch-name.sh "$BRANCH"

      - name: Titre de la PR (devient le message du commit fusionné)
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$TITLE" > "$RUNNER_TEMP/titre.txt"
          .githooks/commit-msg "$RUNNER_TEMP/titre.txt"

      - name: Issue liée
        env:
          BODY: ${{ github.event.pull_request.body }}
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' "$BODY" > "$RUNNER_TEMP/description.txt"
          scripts/check-issue-link.sh "$RUNNER_TEMP/description.txt"

      - name: Messages des commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/message.txt"
            if ! .githooks/commit-msg "$RUNNER_TEMP/message.txt"; then
              echo "::error::Le commit $sha ne respecte pas la convention"
              status=1
            fi
          done
          exit $status
