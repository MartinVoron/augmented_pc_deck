# Versions et publication (voir CONTRIBUTING.md, section « Versions »).
#
# À chaque arrivée sur main :
# 1. s'il y a des commits ajout, correction, perf ou annulation depuis la dernière version,
#    le workflow ouvre (ou met à jour) une PR « version/vX.Y.Z » qui change les numéros
#    de version et complète CHANGELOG.md ;
# 2. quand cette PR est fusionnée, il crée l'étiquette vX.Y.Z, compile l'application
#    sous Windows et publie les installateurs dans une Release GitHub.
#
# Lancement à la main (onglet Actions) : permet de forcer un numéro, par exemple 1.0.0.

name: Version

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      forcer:
        description: "Numéro de version à imposer (X.Y.Z), vide pour le calcul automatique"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: version
  cancel-in-progress: false

jobs:
  preparer:
    name: Préparer la version
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.etat.outputs.action }}
      version: ${{ steps.etat.outputs.version }}
      notes: ${{ steps.etat.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Un jeton personnel (secret VERSION_TOKEN) permet aux vérifications de tourner
          # sur la PR de version. Sans lui, le jeton par défaut suffit pour le reste.
          token: ${{ secrets.VERSION_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Que faut-il faire ?
        id: etat
        env:
          FORCER: ${{ inputs.forcer }}
        run: |
          if [ -n "$FORCER" ]; then
            node scripts/version/version.mjs etat --forcer "$FORCER"
          else
            node scripts/version/version.mjs etat
          fi

      - name: Ouvrir ou mettre à jour la PR de version
        if: steps.etat.outputs.action == 'preparer'
        env:
          GH_TOKEN: ${{ secrets.VERSION_TOKEN || github.token }}
          VERSION: ${{ steps.etat.outputs.version }}
          FORCER: ${{ inputs.forcer }}
        run: |
          if [ -n "$FORCER" ]; then
            node scripts/version/version.mjs preparer --forcer "$FORCER"
          else
            node scripts/version/version.mjs preparer
          fi

          branche="version/v$VERSION"
          titre="maintenance: publier la version $VERSION"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branche"
          git add -A
          git commit -q -m "$titre"
          # Branche gérée uniquement par ce workflow : on la réécrit à chaque passage.
          git fetch -q origin "+refs/heads/$branche:refs/remotes/origin/$branche" || true
          git push --force-with-lease origin "$branche"

          {
            echo "Cette PR a été ouverte automatiquement. Elle prépare la version **$VERSION**."
            echo
            echo "En la fusionnant (Squash and merge), l'étiquette \`v$VERSION\` est créée et"
            echo "l'installateur Windows est publié dans une Release GitHub."
            echo "Tant qu'elle reste ouverte, elle se met à jour à chaque nouvel ajout sur \`main\`."
            echo
            echo "## Notes de version"
            echo
            node scripts/version/version.mjs notes "$VERSION"
          } > "$RUNNER_TEMP/description.md"

          if [ "$(gh pr view "$branche" --json state -q .state 2>/dev/null)" = "OPEN" ]; then
            gh pr edit "$branche" --title "$titre" --body-file "$RUNNER_TEMP/description.md"
          else
            gh pr create --base main --head "$branche" --title "$titre" \
              --body-file "$RUNNER_TEMP/description.md"
          fi

          # Une ancienne PR de version (autre numéro) n'a plus lieu d'être.
          gh pr list --state open --json number,headRefName \
            -q '.[] | "\(.number) \(.headRefName)"' |
            while read -r numero tete; do
              case "$tete" in
                "$branche") ;;
                version/v*)
                  gh pr close "$numero" --delete-branch \
                    --comment "Remplacée par la PR de la version $VERSION."
                  ;;
              esac
            done

  publier:
    name: Publier l'installateur Windows
    needs: preparer
    if: needs.preparer.outputs.action == 'publier'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Installer les dépendances
        run: npm ci

      - name: Compiler et publier la Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tagName: v${{ needs.preparer.outputs.version }}
          releaseName: Augmented PC Deck v${{ needs.preparer.outputs.version }}
          releaseBody: ${{ needs.preparer.outputs.notes }}
          releaseCommitish: ${{ github.sha }}
          releaseDraft: false
          prerelease: false
